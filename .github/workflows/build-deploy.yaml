name: Build and Deploy
on:
  workflow_dispatch: 
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  Build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    steps:
      - name: Build step
        run: echo "Build triggered with pull request."
  Deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - name: Deploy job
        run: echo "Deploying the code to Prod"
